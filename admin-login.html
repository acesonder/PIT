<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - OUTSINC PIT</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-box {
            background: white;
            border-radius: 12px;
            padding: 50px;
            max-width: 450px;
            width: 100%;
            box-shadow: var(--shadow-lg);
        }
        
        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-logo .logo-placeholder {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="login-box">
                <div class="login-logo">
                    <div class="logo-placeholder">OI</div>
                    <h1 style="color: var(--primary-color); margin-bottom: 10px;">Admin Portal</h1>
                    <p style="color: #666;">OUTSINC PIT Count System</p>
                </div>
                
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="passcode">Admin Passcode</label>
                        <input type="password" 
                               id="passcode" 
                               class="form-control" 
                               placeholder="Enter admin passcode" 
                               required 
                               autocomplete="off">
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 20px;">
                        Login to Admin Portal
                    </button>
                </form>
                
                <div style="text-align: center; margin-top: 30px;">
                    <a href="index.html" class="btn btn-outline">← Back to Home</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        async function handleLogin(event) {
            event.preventDefault();
            
            const passcode = document.getElementById('passcode').value;
            await adminLogin(passcode);
        }
        
        // Clear any error messages when typing
        document.getElementById('passcode')?.addEventListener('input', function() {
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(alert => alert.remove());
        });
    </script>
</body>
</html>
