<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Widgets - OUTSINC PIT</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-page">
    <header class="header">
        <div class="header-content">
            <div class="logo-section">
                <div class="logo-placeholder">OI</div>
                <div class="site-title">
                    <h1>OUTSINC Admin</h1>
                    <p>Widget Management</p>
                </div>
            </div>
            <nav class="nav-links">
                <a href="admin.html" class="btn btn-outline">← Dashboard</a>
                <button onclick="adminLogout()" class="btn btn-danger">Logout</button>
            </nav>
        </div>
    </header>

    <div class="container">
        <h1>Manage Data Widgets</h1>
        
        <div class="info-section">
            <p>✅ Check the box in the top-right corner of each widget to display it on the landing page.</p>
            <p>💡 Widgets show live data from assessments and update automatically.</p>
        </div>

        <!-- Widgets Grid -->
        <section>
            <div id="widgets-management-container" class="widgets-grid">
                <p style="text-align: center; padding: 20px;">Loading widgets...</p>
            </div>
        </section>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            await checkAdminSession();
            await displayWidgetsManagement('widgets-management-container');
        });
    </script>
</body>
</html>
